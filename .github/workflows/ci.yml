name: CI

on:
  push:
    branches: [prototype/rust-port]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
      QUIDDITY_CORPUS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The corpus lives in the Python repository, pinned to the revision tests/fixtures/corpus.json
      # was exported at (its quiddity_revision; tests/corpus_files.rs checks the files' digests).
      # The toolchain comes from rust-toolchain.toml.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      # Pins that depend on float round-off, such as known_correspondence.json's faces_at_most,
      # must hold on both platforms: Linux stays the reference for them, and macOS runs too (the
      # maintainer's decision of 2026-10-08; docs/review-2026-10-08.md, H1). The full suite
      # passing on an arm64 Mac, as macos-latest is, was the evidence that macOS holds them.
      - run: cargo test --workspace --release
