name: Suite

# One platform's half of CI (.github/workflows/ci.yml): build the test binaries once, as a
# nextest archive, and run it in shards, one test at a time (.config/nextest.toml).
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      # The shard numbers, 1..N, as a JSON list.
      shards:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest@0.9.146
      - run: cargo nextest archive --workspace --release --archive-file tests-${{ inputs.os }}.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ inputs.os }}
          path: tests-${{ inputs.os }}.tar.zst
          retention-days: 1

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    name: test (${{ inputs.os }}, ${{ matrix.shard }})
    runs-on: ${{ inputs.os }}
    env:
      QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
      QUIDDITY_CORPUS_REQUIRED: "1"
      # Extracted into the workspace, so target/release/quiddity is where CARGO_BIN_EXE_quiddity
      # says. Run through cargo-nextest itself: no toolchain is needed to run the archive.
      ARCHIVE: >-
        --archive-file tests-${{ inputs.os }}.tar.zst
        --extract-to ${{ github.workspace }} --extract-overwrite
        --workspace-remap ${{ github.workspace }}
    steps:
      # The fixtures, at the path the binaries were built at (tests find them through
      # CARGO_MANIFEST_DIR, fixed at compile time).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The corpus lives in the Python repository, pinned to the revision tests/fixtures/corpus.json
      # was exported at (its quiddity_revision; tests/corpus_files.rs checks the files' digests).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest@0.9.146
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tests-${{ inputs.os }}
      # Every test in the archive is dealt to one shard by its measured time (.github/shards.py,
      # .config/test-times.json), so the shards together run the whole suite.
      - run: cargo-nextest nextest list $ARCHIVE --message-format json > tests.json
      - run: >-
          python3 .github/shards.py tests.json .config/test-times.json ${{ runner.os }}
          ${{ matrix.shard }} ${{ strategy.job-total }} > shard.filter
      - run: cargo-nextest nextest run --profile ci $ARCHIVE -E "$(cat shard.filter)"
