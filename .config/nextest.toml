# `cargo nextest` settings; CI (`.github/workflows/ci.yml`) runs the `ci` profile in shards.

[profile.ci]
# Report every failure in a shard, not only the first.
fail-fast = false
# One test at a time: the long tests spread their own work over every core
# (`tests/common/parallel.rs`), so running several at once only shares the cores between them and
# slows each one's longest item (a reading of cgb202, the costliest corpus part, ran four times
# slower beside three other tests).
test-threads = 1

# File-coordinate publication and its downstream consumers (#92).
[profile.file-coordinates]
default-filter = '''
    binary(cli) | binary(serve) | binary(rigid_transform) | binary(corpus_files) |
    binary(snapshot_provenance) | binary(face_accounting) |
    (binary(quiddity) & (
        test(frames::) | test(framed_records::) | test(publication::) |
        test(vector_publication::) | test(recognition::) | test(invariance::) |
        test(correspondence::) | test(fingerprint::) | test(inventory_floor::) |
        test(corpus::) | test(wiring::) | test(serve::) |
        test(modelled_threads::) | test(section_recess_publication::)
    ))
'''
fail-fast = false
test-threads = 1

# CTC-01 face claims, accounting and the downstream regression gates (#100).
[profile.ctc01-accounting]
default-filter = '''
    binary(face_accounting) | binary(cli) | binary(serve) |
    binary(rigid_transform) | binary(corpus_files) | binary(snapshot_provenance) |
    (binary(quiddity) & (
        test(body::) | test(holes::) | test(slots::) | test(inventory_floor::) |
        test(corpus::) | test(correspondence::) | test(fingerprint::) |
        test(framed_records::) | test(recognition::) | test(invariance::) |
        test(publication::) | test(vector_publication::) | test(mfinstseg::)
    ))
'''
fail-fast = false
test-threads = 2

# Maintainer, 2026-10-26: ordinary PRs use these macOS libm-sensitive pins.
# Full Linux always runs; main, dispatch and release* PRs also run full macOS.
# Measured/adjusted pin budget: ~14 test runner-minutes (limit ~60).
# The rigid-motion slices exercise references/correspondence.json faces_at_most;
# correspondence/fingerprint tests pin matching and publication numeric thresholds.
# Corpus and frames snapshots pin numeric records, fingerprints and inferred frame axes.
# Kernel, areas, moments, integrals, drawings (HLR) and revolution pin numeric geometry
# against analytic/independent expectations. No new shards or test concurrency.
[profile.macos-pr]
default-filter = '''
    (binary(quiddity) & (
        test(regression_tests::invariance::recognition_is_invariant_under_rigid_motion::) |
        test(regression_tests::invariance::listed_face_counts_are_pinned_or_bounded) |
        test(regression_tests::correspondence::) |
        test(engine::correspondence::) |
        test(regression_tests::wiring::families_are_wired_and_their_records_fingerprinted_field_by_field) |
        test(regression_tests::corpus::rust_snapshot_corpus) |
        test(regression_tests::frames::rust_snapshot_frames_and_equivariance)
    )) |
    (package(haecceity) & (
        binary(kernel) | binary(face_areas) | binary(face_moments) |
        binary(face_integrals) | binary(drawings) | binary(revolution)
    )) |
    (binary(cli) & test(v011_oriented_fingerprints_correspond_to_merged_step))
'''
fail-fast = false
test-threads = 1
