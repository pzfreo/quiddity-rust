# `cargo nextest` settings; CI (`.github/workflows/ci.yml`) runs the `ci` profile in shards.

[profile.ci]
# Report every failure in a shard, not only the first.
fail-fast = false
# One test at a time: the long tests spread their own work over every core
# (`tests/common/parallel.rs`), so running several at once only shares the cores between them and
# slows each one's longest item (a reading of cgb202, the costliest corpus part, ran four times
# slower beside three other tests).
test-threads = 1

# Focused #91 release checks; the full workspace suite remains CI's job.
[profile.file-axes-win]
fail-fast = false
test-threads = 1
default-filter = """
    test(regression_tests::frames::)
    | test(regression_tests::invariance::)
    | test(regression_tests::inventory_floor::)
    | test(regression_tests::recognition::)
    | test(regression_tests::publication::)
    | test(regression_tests::fillet_convexity::)
    | test(regression_tests::corpus::)
    | binary(rigid_transform)
    | binary(snapshot_provenance)
"""
