[package]
name = "haecceity"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pzfreo/quiddity-rust"
keywords = ["cad", "step", "brep", "geometry", "ap242"]
categories = ["science", "mathematics", "parser-implementations"]
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/tests/fixtures/generated_unit_cube.f3d", "/tests/fixtures/README.md"]
description = "An exact B-rep geometry kernel in pure Rust: STEP import, rays, classification, volumes and surface recovery."

[features]
default = []
f3d = ["dep:cadmpeg-codec-f3d", "dep:cadmpeg-codec-step", "dep:cadmpeg-core", "dep:cadmpeg-ir"]

[dependencies]
cadmpeg-codec-f3d = { version = "=0.6.7", optional = true }
cadmpeg-codec-step = { version = "=0.6.7", optional = true }
cadmpeg-core = { version = "=0.6.7", optional = true }
cadmpeg-ir = { version = "=0.6.7", optional = true }
flate2 = "1.1.10"
i_overlay = "8.1.2"
spade = "2.15.1"
step-io = "0.3"

[dev-dependencies]
serde_json = "1.0.151"
