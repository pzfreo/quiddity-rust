[package]
name = "haecceity"
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "An exact B-rep geometry kernel in pure Rust: STEP import, rays, classification, volumes and surface recovery."

[dependencies]
flate2 = "1.1.10"
i_overlay = "8.1.2"
spade = "2.15.1"
step-io = "0.2.5"

[dev-dependencies]
serde_json = "1.0.151"
